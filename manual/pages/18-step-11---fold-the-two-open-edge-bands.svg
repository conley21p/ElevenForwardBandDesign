			<ns0:text x="49" y="199" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,398) scale(1,-1)">Check the two pieces against each other before attaching either.</ns0:text>
