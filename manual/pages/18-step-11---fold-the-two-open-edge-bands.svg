			<ns0:text x="49" y="219" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,438) scale(1,-1)">Keep both short ends open with their joining allowances intact. Do not join them into loops.</ns0:text>
