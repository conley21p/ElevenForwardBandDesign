			<ns0:text x="32" y="553" style="font-family: Helvetica-Bold; font-size: 22px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,1106) scale(1,-1)">Cut lines, folds and allowances</ns0:text>
			<ns0:text x="32" y="527" style="font-family: Helvetica; font-size: 10px;fill: rgb(32%,40%,44%); stroke:none;" transform="translate(0,1054) scale(1,-1)">Finished sizes are targets. The master layout shows both cut and finished boundaries; not a 1:1 print pattern.</ns0:text>
			<ns0:path d="M 32,508 L 760,508 Z" style="stroke: rgb(78%,83%,85%); stroke-linecap: butt; stroke-width: 1;" />
			<ns0:text x="32" y="22" style="font-family: Helvetica; font-size: 8px;fill: rgb(32%,40%,44%); stroke:none;" transform="translate(0,44) scale(1,-1)">ELEVEN FORWARD  /  EFBD-2026-10-14-R2  /  PROTOTYPE - PHYSICAL FIT NOT VERIFIED</ns0:text>
			<ns0:text x="749.992" y="22" style="font-family: Helvetica-Bold; font-size: 9px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,44) scale(1,-1)">02</ns0:text>
			<ns0:text x="32" y="482" style="font-family: Helvetica-Bold; font-size: 10px;fill: rgb(7%,43%,60%); stroke:none;" transform="translate(0,964) scale(1,-1)">PART / FINISHED TARGET</ns0:text>
			<ns0:text x="350" y="482" style="font-family: Helvetica-Bold; font-size: 10px;fill: rgb(7%,43%,60%); stroke:none;" transform="translate(0,964) scale(1,-1)">CUTTING RULE</ns0:text>
			<ns0:text x="32" y="459" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,918) scale(1,-1)">#1 34 wide; 7 base / 10 max high</ns0:text>
			<ns0:text x="350" y="459" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,918) scale(1,-1)">Offset all joining edges by 0.25 in; preserve the shaped zone.</ns0:text>
			<ns0:path d="M 32,417 L 760,417 Z" style="stroke: rgb(83%,87%,89%); stroke-linecap: butt; stroke-width: 0.5;" />
			<ns0:text x="32" y="397" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,794) scale(1,-1)">#2a 10 x 3 max</ns0:text>
			<ns0:text x="350" y="397" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,794) scale(1,-1)">Add 0.25 in only at turned attachment perimeter; none at free overedge.</ns0:text>
			<ns0:path d="M 32,355 L 760,355 Z" style="stroke: rgb(83%,87%,89%); stroke-linecap: butt; stroke-width: 0.5;" />
			<ns0:text x="32" y="335" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,670) scale(1,-1)">#2b 10 x 3 max</ns0:text>
			<ns0:text x="350" y="335" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,670) scale(1,-1)">Same allowances as #2a, reflected vertically; both cutouts stay left.</ns0:text>
			<ns0:path d="M 32,293 L 760,293 Z" style="stroke: rgb(83%,87%,89%); stroke-linecap: butt; stroke-width: 0.5;" />
			<ns0:text x="32" y="273" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,546) scale(1,-1)">#3 34 x 2 finished; cut 34.5 x 4.5</ns0:text>
			<ns0:text x="350" y="273" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,546) scale(1,-1)">Cut two 34.5 x 4.5 in strips; keep short ends open.</ns0:text>
			<ns0:path d="M 32,231 L 760,231 Z" style="stroke: rgb(83%,87%,89%); stroke-linecap: butt; stroke-width: 0.5;" />
			<ns0:text x="32" y="211" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,422) scale(1,-1)">#4 2 x 11 finished; cut 2.5 x 11.5</ns0:text>
			<ns0:text x="350" y="211" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,422) scale(1,-1)">Cut 2.5 x 11.5 in; side seams plus short-edge hems.</ns0:text>
			<ns0:path d="M 32,169 L 760,169 Z" style="stroke: rgb(83%,87%,89%); stroke-linecap: butt; stroke-width: 0.5;" />
			<ns0:rect x="32" y="55" width="354" height="83" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(92%,95%,96%); fill-rule: evenodd;" />
			<ns0:rect x="32" y="55" width="3" height="83" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,43%,60%); fill-rule: evenodd;" />
			<ns0:text x="44" y="118" style="font-family: Helvetica-Bold; font-size: 10px;fill: rgb(7%,43%,60%); stroke:none;" transform="translate(0,236) scale(1,-1)">FOLDED BAND CALCULATION</ns0:text>
			<ns0:text x="44" y="100" style="font-family: Helvetica; font-size: 9px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,200) scale(1,-1)">4.5 / 2 - 0.25 = 2 in finished projection. The short-end allowances join #4, not each</ns0:text>
			<ns0:text x="44" y="88" style="font-family: Helvetica; font-size: 9px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,176) scale(1,-1)">other.</ns0:text>
			<ns0:rect x="402" y="55" width="358" height="83" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(92%,95%,96%); fill-rule: evenodd;" />
			<ns0:rect x="402" y="55" width="3" height="83" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,43%,60%); fill-rule: evenodd;" />
			<ns0:text x="414" y="118" style="font-family: Helvetica-Bold; font-size: 10px;fill: rgb(7%,43%,60%); stroke:none;" transform="translate(0,236) scale(1,-1)">LINE LEGEND</ns0:text>
			<ns0:text x="414" y="100" style="font-family: Helvetica; font-size: 9px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,200) scale(1,-1)">Pale outline = cut. Blue dashed = finished seam / fold-under line. Orange dashed =</ns0:text>
			<ns0:text x="414" y="88" style="font-family: Helvetica; font-size: 9px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,176) scale(1,-1)">fold or basting. Red = leave open.</ns0:text>
