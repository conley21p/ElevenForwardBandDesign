			<ns0:text x="500" y="278" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,556) scale(1,-1)">A flat bag fitting does not prove that a filled pouch will fit.</ns0:text>
