			<ns0:text x="49" y="206" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,412) scale(1,-1)">Check flange/outlet access, retention, recovery and smooth band placement at each stage.</ns0:text>
			<ns0:text x="32" y="186" style="font-family: Helvetica-Bold; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,372) scale(1,-1)">4.</ns0:text>
			<ns0:text x="49" y="186" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,372) scale(1,-1)">Assess required slip-on extension on a suitable fixture; record the limiting material or seam.</ns0:text>
