			<ns0:text x="49" y="239" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,478) scale(1,-1)">Measure perpendicular to the local body plane at the fullest part, not from the outer band</ns0:text>
