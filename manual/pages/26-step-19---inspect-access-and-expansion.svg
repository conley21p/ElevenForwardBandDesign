			<ns0:text x="49" y="259" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,518) scale(1,-1)">On the fixture, insert the reference and test intermediate depth before the 1.5-inch target.</ns0:text>
