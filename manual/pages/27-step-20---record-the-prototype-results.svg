			<ns0:text x="49" y="226" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,452) scale(1,-1)">Launder only by the selected materials care instructions; record actual cycle and drying</ns0:text>
