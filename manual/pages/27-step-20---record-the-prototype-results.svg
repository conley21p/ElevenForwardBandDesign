			<ns0:text x="49" y="173" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,346) scale(1,-1)">Attach dated results and photos to the revision. Leave unperformed checks as requires retest.</ns0:text>
