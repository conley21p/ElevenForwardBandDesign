			<ns0:text x="49" y="193" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,386) scale(1,-1)">Remeasure after relaxation and repeat access, seam and recovery checks.</ns0:text>
