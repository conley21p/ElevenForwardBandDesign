			<ns0:text x="49" y="259" style="font-family: Helvetica; font-size: 10px;fill: rgb(12%,20%,23%); stroke:none;" transform="translate(0,518) scale(1,-1)">Record fabric lots, machine settings, dimensions, tested extension and all depth-check</ns0:text>
